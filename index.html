<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BuloJS — Home</title>
<meta name="description" content="Accès rapide à mes projets GitHub Pages.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏠</text></svg>">
<style>
  /* Thème sombre unique, dans l'esprit macOS : gris graphite plutôt que noir. */
  :root {
    color-scheme: dark;
    --bg: #1c1d21;
    --bg-top: #2a2c33;
    --surface: #2c2e34;
    --surface-hover: #383a42;
    --border: rgba(255, 255, 255, .10);
    --border-hover: rgba(255, 255, 255, .22);
    --text: #f5f5f7;
    --muted: #aeb0b6;
    --shadow: 0 10px 30px rgba(0, 0, 0, .35);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    padding: clamp(2.5rem, 8vw, 6rem) clamp(1rem, 5vw, 3rem);
    background: var(--bg);
    background-image: radial-gradient(120% 70% at 50% 0%, var(--bg-top) 0%, var(--bg) 55%);
    background-attachment: fixed;
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display",
                 "Helvetica Neue", "Segoe UI", Roboto, ui-sans-serif, system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }

  header {
    max-width: 1000px;
    margin: 0 auto clamp(2.5rem, 6vw, 4rem);
    text-align: center;
  }

  h1 {
    margin: 0 0 .6rem;
    font-size: clamp(2.1rem, 6vw, 3.2rem);
    font-weight: 700;
    letter-spacing: -0.025em;
  }

  header p {
    margin: 0;
    color: var(--muted);
    font-size: clamp(1rem, 2.6vw, 1.15rem);
    letter-spacing: -0.005em;
  }

  main { max-width: 1000px; margin: 0 auto; }

  /* Colonnes plafonnées + grille centrée : les carrés restent groupés au milieu. */
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(min(210px, 100%), 240px));
    justify-content: center;
    gap: clamp(1rem, 2.5vw, 1.5rem);
  }

  .tile {
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    justify-content: space-between;
    aspect-ratio: 1 / 1;
    padding: 1.4rem;
    border: 1px solid var(--border);
    border-radius: 22px;
    background: var(--surface);
    box-shadow: var(--shadow);
    color: inherit;
    text-decoration: none;
    isolation: isolate;
    overflow: hidden;
    transition: transform .22s cubic-bezier(.22, 1, .36, 1),
                background-color .22s ease, border-color .22s ease, box-shadow .22s ease;
  }

  /* Voile coloré propre à chaque tuile, très discret au repos. */
  .tile::before {
    content: "";
    position: absolute;
    inset: 0;
    z-index: -1;
    background: radial-gradient(120% 90% at 15% 0%, var(--tint) 0%, transparent 65%);
    opacity: .30;
    transition: opacity .22s ease;
  }

  .tile:hover,
  .tile:focus-visible {
    transform: translateY(-5px);
    background: var(--surface-hover);
    border-color: var(--border-hover);
    box-shadow: 0 18px 40px rgba(0, 0, 0, .45);
    outline: none;
  }

  .tile:hover::before,
  .tile:focus-visible::before { opacity: .55; }

  .tile:focus-visible { outline: 3px solid #0a84ff; outline-offset: 3px; }

  .tile:active { transform: translateY(-1px) scale(.985); }

  /* Pastille façon icône d'app : dégradé arrondi. */
  .icon {
    display: grid;
    place-items: center;
    width: 54px;
    height: 54px;
    border-radius: 15px;
    background: linear-gradient(150deg, var(--tint), var(--tint-2));
    box-shadow: 0 6px 16px rgba(0, 0, 0, .35), inset 0 1px 0 rgba(255, 255, 255, .28);
    font-size: 1.65rem;
    line-height: 1;
  }

  .label { width: 100%; }

  .name {
    display: block;
    font-size: 1.2rem;
    font-weight: 600;
    letter-spacing: -0.015em;
    word-break: break-word;
  }

  .desc {
    display: block;
    margin-top: .25rem;
    font-size: .9rem;
    color: var(--muted);
    line-height: 1.35;
  }

  .arrow {
    position: absolute;
    top: 1.5rem;
    right: 1.4rem;
    color: var(--muted);
    opacity: .75;
    transition: transform .22s ease, opacity .22s ease;
  }

  .tile:hover .arrow,
  .tile:focus-visible .arrow { opacity: 1; transform: translate(2px, -2px); }

  @media (prefers-reduced-motion: reduce) {
    .tile, .tile::before, .arrow { transition: none; }
    .tile:hover, .tile:focus-visible, .tile:active { transform: none; }
  }
</style>
</head>
<body>

<header>
  <h1>BuloJS</h1>
  <p>Mes projets hébergés sur GitHub Pages</p>
</header>

<main>
  <!--
    Pour ajouter / retirer un carré : modifie simplement la liste ci-dessous.
    - name  : le texte affiché
    - url   : le lien (par défaut https://bulojs.github.io/<repo>/)
    - emoji : optionnel, l'icône dans la pastille
    - desc  : optionnel, la ligne sous le nom
    - tint  : optionnel, les 2 couleurs du dégradé de la pastille
  -->
  <div class="grid" id="grid"></div>
</main>

<script>
  const SITES = [
    { name: "Simu-SCI", url: "https://bulojs.github.io/Simu-SCI/", emoji: "🏢",
      desc: "Simulateur SCI",       tint: ["#0a84ff", "#5e5ce6"] },
    { name: "Series",   url: "https://bulojs.github.io/Series/",   emoji: "📺",
      desc: "Classement de séries", tint: ["#ff375f", "#ff9f0a"] },
    { name: "Finance",  url: "https://bulojs.github.io/Finance/",  emoji: "💰",
      desc: "Outils finance",       tint: ["#30d158", "#0a84ff"] },
  ];

  const DEFAULT_TINT = ["#0a84ff", "#5e5ce6"];
  const grid = document.getElementById("grid");

  for (const site of SITES) {
    const [tint, tint2] = site.tint || DEFAULT_TINT;

    const a = document.createElement("a");
    a.className = "tile";
    a.href = site.url;
    a.style.setProperty("--tint", tint);
    a.style.setProperty("--tint-2", tint2);

    const icon = document.createElement("span");
    icon.className = "icon";
    icon.setAttribute("aria-hidden", "true");
    icon.textContent = site.emoji || "🔗";
    a.appendChild(icon);

    const arrow = document.createElement("span");
    arrow.className = "arrow";
    arrow.setAttribute("aria-hidden", "true");
    arrow.innerHTML = '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17 17 7"/><path d="M9 7h8v8"/></svg>';
    a.appendChild(arrow);

    const label = document.createElement("span");
    label.className = "label";

    const name = document.createElement("span");
    name.className = "name";
    name.textContent = site.name;
    label.appendChild(name);

    if (site.desc) {
      const desc = document.createElement("span");
      desc.className = "desc";
      desc.textContent = site.desc;
      label.appendChild(desc);
    }

    a.appendChild(label);
    grid.appendChild(a);
  }
</script>

</body>
</html>
